<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="{{ react_theme_color|default('#0a0a0a', true) }}" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="{{ react_description|default('MSI School Portal', true) }}"
    />
    <title>{{ react_page_title|default('MSI School Portal', true) }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}" />
    <link rel="manifest" href="{{ url_for('system.manifest') }}" />
    {% if react_enable_telegram|default(true, true) %}
    <link rel="preconnect" href="https://telegram.org" />
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='react/app.css', v=asset_version) }}" />
  </head>
  <body
    class="{{ react_body_class|default('', true) }}"
    {% if react_tg_back_mode %}data-tg-back-mode="{{ react_tg_back_mode }}"{% endif %}
    {% if react_tg_back_url %}data-tg-back-url="{{ react_tg_back_url }}"{% endif %}
  >
    <div id="root"></div>
    <script id="msi-react-bootstrap" type="application/json">
      {{ {"page": react_page_name, "props": react_props}|tojson|safe }}
    </script>
    <script type="module" src="{{ url_for('static', filename='react/app.js') }}"></script>
    {% if react_enable_telegram|default(true, true) %}
    <script defer src="{{ url_for('static', filename='js/bundles/telegram-base.js', v=asset_version) }}"></script>
    {% endif %}
  </body>
</html>
