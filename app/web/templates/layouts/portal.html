<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="MSI School student portal for quick mobile-friendly academic access." />
    <title>MSI School Portal</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}" />
    <link rel="manifest" href="{{ url_for('system.manifest') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles/portal.css', v=asset_version) }}" />
  </head>
  <body class="{{ body_class|default('home-page', true) }}">
    <div class="bg-shape bg-shape-top"></div>
    <div class="bg-shape bg-shape-bottom"></div>

    <main class="home-wrap">
      <section class="login-card animate-in">
        {% block header %}{% endblock %}

        {% if auth_error %}
        <div class="form-error">{{ auth_error }}</div>
        {% endif %}

        {% if admin_notice %}
        <div class="form-notice">{{ admin_notice }}</div>
        {% endif %}

        {% if error %}
        <div class="form-error">{{ error }}</div>
        {% endif %}

        {% block content %}{% endblock %}
      </section>
    </main>

    {% block scripts %}{% endblock %}
    <script defer src="{{ url_for('static', filename='js/pwa.js', v=asset_version) }}"></script>
  </body>
</html>
