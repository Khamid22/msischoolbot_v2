<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Student Not Found</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}" />
    <link rel="manifest" href="{{ url_for('manifest') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles/base.css', v=asset_version) }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles/pages.css', v=asset_version) }}" />
  </head>
  <body class="not-found-page">
    <main class="not-found-wrap">
      <section class="not-found-card animate-in">
        <div class="logo-block" aria-hidden="true" style="margin: 0 auto 18px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 8v4M12 16h.01"></path>
          </svg>
        </div>
        <h1>Student Not Found</h1>
        <p>{{ message or 'We could not retrieve data for this student. Please search again.' }}</p>
        <a href="{{ url_for('home') }}" class="primary-btn">Return to Search</a>
      </section>
    </main>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="{{ url_for('static', filename='js/telegram-init.js', v=asset_version) }}"></script>
    <script defer src="{{ url_for('static', filename='js/pwa.js', v=asset_version) }}"></script>
  </body>
</html>
