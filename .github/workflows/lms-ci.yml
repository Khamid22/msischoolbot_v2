name: LMS CI

on:
  push:
    branches: [FastAPI-Run-System]
  pull_request:
    branches: [FastAPI-Run-System]

permissions:
  contents: read

concurrency:
  group: lms-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check main.py backend tests
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check-types
        working-directory: frontend
      - run: npm run test:logic
        working-directory: frontend
      - run: npm run test:schedule
        working-directory: frontend
      - run: npm run test:shared-ui
        working-directory: frontend
      - run: npm run test:academic
        working-directory: frontend
      - run: npm run test:recruitment
        working-directory: frontend
      - run: npm run test:teacher
        working-directory: frontend
      - run: npm run test:parent
        working-directory: frontend
      - run: npm run test:student-billing
        working-directory: frontend
      - run: npm run test:customer-support
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
