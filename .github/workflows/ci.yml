name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend sources
        run: |
          python -m compileall -q config.py main.py web/backend telegram_bot database_storage
      - name: Import smoke test
        env:
          BOT_TOKEN: "ci-placeholder"
          MINI_APP_URL: "https://example.com"
          DATABASE_URL: "postgresql://user:pass@localhost:5432/ci"
        run: |
          python -c "from web.backend.main import app; print('routes:', len(list(app.url_map.iter_rules())))"
          python -c "import telegram_bot.handlers.start, telegram_bot.handlers.account_link, telegram_bot.handlers.quick_summary, telegram_bot.handlers.contact_us; print('bot handlers import ok')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Type check
        run: npm run check-types
      - name: Build frontend
        run: npm run build
